# nginx site for the B4/B9 WebArena-style SPA.
#
# This replaces Debian's stock sites-enabled/default, which CANNOT be used
# inside a CubeSandbox microVM. The stock config contains:
#
#     listen 80 default_server;
#     listen [::]:80 default_server;
#
# and the Cube guest kernel is built without IPv6, so nginx aborts at
# startup with
#
#     nginx: [emerg] socket() [::]:80 failed
#            (97: Address family not supported by protocol)
#
# Nothing recovers from that: start.sh backgrounds nginx, so the failure is
# silent, port 80 simply never opens, and the only visible symptom is the
# template build timing out on its readiness probe (or CubeProxy answering
# 502 for that port). Diagnosed on a live c7g.metal guest.
#
# Note this is not reproducible under Docker by disabling IPv6 via sysctl -
# there AF_INET6 still exists and socket() succeeds. The guest kernel lacks
# the address family outright.
#
# So: IPv4 only, and everything nginx writes goes somewhere unambiguously
# writable, since the rootfs is an overlay whose upper layer is a
# per-sandbox CoW volume.
server {
    listen 80 default_server;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA is fetched by Playwright thousands of times per run; access
    # logging every request would be pure write amplification on the
    # per-sandbox writable layer, and it is never read.
    access_log off;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
